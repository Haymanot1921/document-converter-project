services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      MAX_FILE_SIZE_MB: 20
      CONVERSION_TIMEOUT_MS: 120000
      PYTHON_BIN: python3
      UPLOAD_DIR: /app/tmp/uploads
      OUTPUT_DIR: /app/tmp/outputs
    ports:
      - "5000:5000"
    tmpfs:
      - /app/tmp:size=512m,mode=1777
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
